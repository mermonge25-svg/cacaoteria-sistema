<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lotes - Cacaotería S.R.L.</title>

    <!-- =====================================================
         LIBRERÍA DE SUPABASE
         ===================================================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <style>

        :root {
            --sidebar-bg: #1c1917;
            --sidebar-hover: #292524;

            --header-bg: rgba(255, 255, 255, 0.95);
            --card-bg: rgba(255, 255, 255, 0.92);
            --card-hover: #ffffff;

            --text-main: #1c1917;
            --text-muted: #5a3825;

            --brand-primary: #5a3825;

            --border-color: rgba(90, 56, 37, 0.2);

            --shadow-sm:
                0 2px 5px rgba(0, 0, 0, 0.1);

            --shadow-md:
                0 6px 15px rgba(0, 0, 0, 0.15);

            --radius: 12px;
        }


        * {
            box-sizing: border-box;

            margin: 0;
            padding: 0;
        }


        body {

            font-family:
                "Times New Roman",
                Times,
                serif;

            background-image:
                url("imagenes/fondo_pgn.png");

            background-size: cover;

            background-position: center;

            background-attachment: fixed;

            background-repeat: no-repeat;

            color: var(--text-main);

            display: flex;

            min-height: 100vh;

            position: relative;
        }


        /* =====================================================
           BARRA LATERAL
           ===================================================== */

        aside {

            width: 250px;

            background-color:
                var(--sidebar-bg);

            color: #d6d3d1;

            display: flex;

            flex-direction: column;

            padding: 24px 16px;

            position: fixed;

            top: 0;
            bottom: 0;

            left: -250px;

            z-index: 1000;

            transition:
                left 0.3s ease-in-out;

            box-shadow:
                4px 0 12px rgba(0, 0, 0, 0.3);
        }


        aside.active {

            left: 0;
        }


        .sidebar-header {

            display: flex;

            justify-content:
                space-between;

            align-items: center;

            margin-bottom: 24px;

            padding-left: 8px;
        }


        .sidebar-brand {

            font-size: 1.1rem;

            font-weight: bold;

            text-transform: uppercase;

            letter-spacing: 0.05em;

            color: #a8a29e;
        }


        .btn-close {

            background: none;

            border: none;

            color: #a8a29e;

            font-size: 1.5rem;

            cursor: pointer;

            padding: 0 8px;
        }


        .btn-close:hover {

            color: #ffffff;
        }


        .sidebar-nav {

            list-style: none;

            display: flex;

            flex-direction: column;

            gap: 6px;
        }


        .sidebar-nav a {

            color: #e7e5e4;

            text-decoration: none;

            padding: 12px 14px;

            border-radius: 8px;

            font-size: 1.05rem;

            display: block;

            transition:
                background-color 0.2s;
        }


        .sidebar-nav a:hover {

            background-color:
                var(--sidebar-hover);

            color: #ffffff;
        }


        .overlay {

            position: fixed;

            top: 0;
            left: 0;
            right: 0;
            bottom: 0;

            background-color:
                rgba(0, 0, 0, 0.4);

            display: none;

            z-index: 999;
        }


        .overlay.active {

            display: block;
        }


        /* =====================================================
           CONTENEDOR PRINCIPAL
           ===================================================== */

        .main-wrapper {

            flex: 1;

            display: flex;

            flex-direction: column;

            width: 100%;
        }


        /* =====================================================
           ENCABEZADO
           ===================================================== */

        header {

            background-color:
                var(--header-bg);

            border-bottom:
                1px solid var(--border-color);

            padding: 16px 30px;

            display: flex;

            align-items: center;

            gap: 20px;

            backdrop-filter:
                blur(5px);

            box-shadow:
                var(--shadow-sm);
        }


        .btn-menu {

            background: none;

            border:
                1px solid var(--border-color);

            border-radius: 8px;

            font-size: 1.4rem;

            padding: 6px 12px;

            cursor: pointer;

            color:
                var(--brand-primary);

            transition:
                background-color 0.2s;
        }


        .btn-menu:hover {

            background-color:
                rgba(90, 56, 37, 0.1);
        }


        .header-company {

            display: flex;

            align-items: center;

            gap: 16px;
        }


        .logo {

            height: 50px;

            width: auto;

            object-fit: contain;
        }


        .company-info h1 {

            font-size: 1.6rem;

            font-weight: bold;

            color:
                var(--brand-primary);

            line-height: 1.2;
        }


        .company-info p {

            font-size: 1rem;

            color:
                var(--text-muted);
        }


        /* =====================================================
           ÁREA DE CONTENIDO
           ===================================================== */

        .content {

            padding: 40px 30px;

            max-width: 1200px;

            width: 100%;

            margin: 0 auto;

            flex: 1;
        }


        .page-title {

            font-size: 1.8rem;

            font-weight: bold;

            color:
                var(--brand-primary);

            margin-bottom: 24px;

            text-shadow:
                0 1px 2px rgba(255, 255, 255, 0.8);
        }


        /* =====================================================
           FORMULARIO
           ===================================================== */

        .form-container {

            background-color:
                var(--card-bg);

            border:
                1px solid var(--border-color);

            border-radius:
                var(--radius);

            padding: 25px;

            box-shadow:
                var(--shadow-sm);

            margin-bottom: 30px;
        }


        .form-grid {

            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 20px;
        }


        .form-group {

            display: flex;

            flex-direction: column;
        }


        .form-group label {

            color:
                var(--brand-primary);

            font-weight: bold;

            margin-bottom: 7px;

            font-size: 1rem;
        }


        .form-group input {

            width: 100%;

            padding: 11px 13px;

            border:
                1px solid
                rgba(90, 56, 37, 0.3);

            border-radius: 8px;

            font-family:
                "Times New Roman",
                Times,
                serif;

            font-size: 1rem;

            outline: none;

            transition:
                border-color 0.2s,
                box-shadow 0.2s;
        }


        .form-group input:focus {

            border-color:
                var(--brand-primary);

            box-shadow:
                0 0 0 3px
                rgba(90, 56, 37, 0.1);
        }


        .form-actions {

            display: flex;

            justify-content: flex-end;

            gap: 10px;

            margin-top: 20px;
        }


        .btn-primary {

            background-color:
                var(--brand-primary);

            color: white;

            border: none;

            border-radius: 8px;

            padding: 11px 20px;

            font-family:
                "Times New Roman",
                Times,
                serif;

            font-size: 1rem;

            font-weight: bold;

            cursor: pointer;

            transition:
                background-color 0.2s;
        }


        .btn-primary:hover {

            background-color: #6b4530;
        }


        .btn-secondary {

            background-color:
                #e7e5e4;

            color:
                var(--text-main);

            border: none;

            border-radius: 8px;

            padding: 11px 20px;

            font-family:
                "Times New Roman",
                Times,
                serif;

            font-size: 1rem;

            cursor: pointer;
        }


        .btn-secondary:hover {

            background-color:
                #d6d3d1;
        }


        /* =====================================================
           TABLA
           ===================================================== */

        .table-container {

            background-color:
                var(--card-bg);

            border:
                1px solid var(--border-color);

            border-radius:
                var(--radius);

            box-shadow:
                var(--shadow-sm);

            overflow-x: auto;
        }


        table {

            width: 100%;

            border-collapse:
                collapse;
        }


        thead {

            background-color:
                rgba(90, 56, 37, 0.08);
        }


        th {

            padding: 14px 16px;

            text-align: left;

            color:
                var(--brand-primary);

            font-size: 1rem;

            border-bottom:
                1px solid var(--border-color);
        }


        td {

            padding: 13px 16px;

            border-bottom:
                1px solid
                rgba(90, 56, 37, 0.12);

            font-size: 1rem;
        }


        tbody tr:hover {

            background-color:
                rgba(90, 56, 37, 0.04);
        }


        /* =====================================================
           BOTONES EDITAR Y ELIMINAR
           ===================================================== */

        .acciones {

            white-space: nowrap;
        }


        .btn-editar,
        .btn-eliminar {

            background: transparent;

            border: none;

            padding: 3px;

            margin-right: 8px;

            cursor: pointer;

            display: inline-flex;

            align-items: center;

            justify-content: center;
        }


        .btn-editar svg,
        .btn-eliminar svg {

            width: 20px;

            height: 20px;
        }


        .btn-editar {

            color: #6b4530;
        }


        .btn-editar:hover {

            color: #402719;
        }


        .btn-eliminar {

            color: #aaa;
        }


        .btn-eliminar:hover {

            color: #777;
        }


        /* =====================================================
           MENSAJES
           ===================================================== */

        .mensaje {

            padding: 12px 15px;

            border-radius: 8px;

            margin-bottom: 20px;

            display: none;

            font-size: 1rem;
        }


        .mensaje.exito {

            display: block;

            background-color:
                rgba(46, 107, 62, 0.12);

            color: #2e6b3e;

            border:
                1px solid
                rgba(46, 107, 62, 0.25);
        }


        .mensaje.error {

            display: block;

            background-color:
                rgba(160, 0, 0, 0.08);

            color: #a00000;

            border:
                1px solid
                rgba(160, 0, 0, 0.20);
        }


        /* =====================================================
           FOOTER
           ===================================================== */

        footer {

            padding: 20px;

            border-top:
                1px solid var(--border-color);

            text-align: center;

            font-size: 0.95rem;

            color:
                var(--brand-primary);

            background-color:
                var(--header-bg);

            backdrop-filter:
                blur(5px);
        }


        /* =====================================================
           RESPONSIVE
           ===================================================== */

        @media (max-width: 700px) {

            .content {

                padding:
                    24px 16px;
            }


            header {

                padding:
                    16px;
            }


            .form-grid {

                grid-template-columns:
                    1fr;
            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         CAPA OSCURA
         ===================================================== -->

    <div
        class="overlay"
        id="overlay"
        onclick="toggleMenu()">
    </div>


    <!-- =====================================================
         BARRA LATERAL
         ===================================================== -->

    <aside id="sidebar">

        <div class="sidebar-header">

            <span class="sidebar-brand">
                Menú
            </span>

            <button
                class="btn-close"
                onclick="toggleMenu()">

                &times;

            </button>

        </div>


        <ul class="sidebar-nav">

            <li>
                <a href="index.html">
                    Inicio
                </a>
            </li>

            <li>
                <a href="#">
                    Reportes
                </a>
            </li>

            <li>
                <a href="#">
                    Ajustes
                </a>
            </li>

            <li>
                <a href="#">
                    Usuarios
                </a>
            </li>

            <li>
                <a href="lote.html">
                    Lote
                </a>
            </li>

        </ul>

    </aside>


    <!-- =====================================================
         CONTENEDOR PRINCIPAL
         ===================================================== -->

    <div class="main-wrapper">


        <!-- =================================================
             ENCABEZADO
             ================================================= -->

        <header>

            <button
                class="btn-menu"
                onclick="toggleMenu()"
                title="Abrir menú">

                ☰

            </button>


            <div class="header-company">

                <img
                    src="imagenes/logo_pgn.png"
                    alt="Logo Cacaotería S.R.L."
                    class="logo"
                >


                <div class="company-info">

                    <h1>
                        Cacaotería S.R.L.
                    </h1>

                    <p>
                        Sistema de Gestión Operativa
                    </p>

                </div>

            </div>

        </header>


        <!-- =================================================
             CONTENIDO
             ================================================= -->

        <main class="content">


            <h2 class="page-title">
                Gestión de Lotes
            </h2>


            <!-- MENSAJE -->

            <div
                id="mensaje"
                class="mensaje">
            </div>


            <!-- =================================================
                 FORMULARIO
                 ================================================= -->

            <div class="form-container">

                <form id="lote-form">


                    <div class="form-grid">


                        <!-- LOTE -->

                        <div class="form-group">

                            <label for="lote">
                                Lote
                            </label>

                            <input
                                type="text"
                                id="lote"
                                placeholder="Ingrese el lote"
                                required
                            >

                        </div>


                        <!-- FECHA DE VENCIMIENTO -->

                        <div class="form-group">

                            <label for="fecha-vencimiento">
                                Fecha de vencimiento
                            </label>

                            <input
                                type="date"
                                id="fecha-vencimiento"
                                required
                            >

                        </div>


                    </div>


                    <div class="form-actions">


                        <button
                            type="button"
                            class="btn-secondary"
                            id="btn-cancelar"
                            onclick="cancelarEdicion()"
                            style="display: none;">

                            Cancelar

                        </button>


                        <button
                            type="submit"
                            class="btn-primary"
                            id="btn-guardar">

                            Guardar lote

                        </button>


                    </div>


                </form>

            </div>


            <!-- =================================================
                 TABLA DE LOTES
                 ================================================= -->

            <div class="table-container">

                <table>

                    <thead>

                        <tr>

                            <th>
                                Lote
                            </th>

                            <th>
                                Fecha de vencimiento
                            </th>

                            <th>
                                Acciones
                            </th>

                        </tr>

                    </thead>


                    <tbody id="tabla-lotes">

                        <tr>

                            <td
                                colspan="3"
                                style="text-align: center;">

                                Cargando lotes...

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>


        </main>


        <!-- =================================================
             FOOTER
             ================================================= -->

        <footer>

            Cacaotería S.R.L.
            &copy; 2026 · Sistema de Gestión Operativa v3.1

        </footer>


    </div>


    <!-- =====================================================
         JAVASCRIPT
         ===================================================== -->

    <script>


        /* =====================================================
           DATOS DE SUPABASE
           ===================================================== */

        const SUPABASE_URL =
            "https://shjfohkiyfnqedrzjqpy.supabase.co";


        const SUPABASE_KEY =
            "sb_publishable_PT4ozb9f0-0BoLE5yZDpBw_hhXPCzOs";


        /* =====================================================
           CREAR CLIENTE SUPABASE
           ===================================================== */

        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        /* =====================================================
           VARIABLES
           ===================================================== */

        let lotes = [];

        let loteEditando = null;


        /* =====================================================
           MENÚ
           ===================================================== */

        function toggleMenu() {

            const sidebar =
                document.getElementById(
                    "sidebar"
                );

            const overlay =
                document.getElementById(
                    "overlay"
                );


            sidebar.classList.toggle(
                "active"
            );

            overlay.classList.toggle(
                "active"
            );

        }


        /* =====================================================
           MENSAJES
           ===================================================== */

        function mostrarMensaje(
            texto,
            tipo
        ) {

            const mensaje =
                document.getElementById(
                    "mensaje"
                );


            mensaje.textContent =
                texto;


            mensaje.className =
                "mensaje " + tipo;


            setTimeout(function() {

                mensaje.className =
                    "mensaje";

            }, 4000);

        }


        /* =====================================================
           CARGAR LOTES
           ===================================================== */

        async function cargarLotes() {

            const tabla =
                document.getElementById(
                    "tabla-lotes"
                );


            tabla.innerHTML = `
                <tr>
                    <td
                        colspan="3"
                        style="text-align: center;">
                        Cargando lotes...
                    </td>
                </tr>
            `;


            try {

                const {
                    data,
                    error
                } =
                    await supabaseClient
                        .from("Lotes")
                        .select('"Lote", "Fecha vencimiento"')
                        .order(
                            "Lote",
                            {
                                ascending: true
                            }
                        );


                if (error) {

                    console.error(
                        "Error al cargar lotes:",
                        error
                    );

                    tabla.innerHTML = `
                        <tr>
                            <td
                                colspan="3"
                                style="text-align: center;">
                                No se pudieron cargar los lotes.
                            </td>
                        </tr>
                    `;

                    mostrarMensaje(
                        "Error al cargar los lotes: " +
                        error.message,
                        "error"
                    );

                    return;
                }


                lotes = data || [];


                mostrarLotes();


            } catch (error) {

                console.error(error);


                tabla.innerHTML = `
                    <tr>
                        <td
                            colspan="3"
                            style="text-align: center;">
                            Ocurrió un error.
                        </td>
                    </tr>
                `;


                mostrarMensaje(
                    "Ocurrió un error al cargar los lotes.",
                    "error"
                );

            }

        }


        /* =====================================================
           MOSTRAR LOTES
           ===================================================== */

        function mostrarLotes() {

            const tabla =
                document.getElementById(
                    "tabla-lotes"
                );


            if (!lotes.length) {

                tabla.innerHTML = `
                    <tr>
                        <td
                            colspan="3"
                            style="text-align: center;">
                            No hay lotes registrados.
                        </td>
                    </tr>
                `;

                return;
            }


            tabla.innerHTML =
                lotes.map(
                    function(lote, indice) {

                        let fecha =
                            lote["Fecha vencimiento"];


                        if (fecha) {

                            const partes =
                                fecha.split("-");


                            if (
                                partes.length === 3
                            ) {

                                fecha =
                                    partes[2] +
                                    "/" +
                                    partes[1] +
                                    "/" +
                                    partes[0];

                            }

                        }


                        return `

                            <tr>

                                <td>
                                    ${escapeHtml(
                                        lote.Lote
                                    )}
                                </td>

                                <td>
                                    ${escapeHtml(
                                        fecha || ""
                                    )}
                                </td>

                                <td class="acciones">

                                    <button
                                        class="btn-editar"
                                        title="Editar"
                                        aria-label="Editar lote"
                                        onclick="editarLote(${indice})">

                                        <svg
                                            viewBox="0 0 24 24"
                                            fill="none"
                                            stroke="currentColor"
                                            stroke-width="2">

                                            <path d="M12 20h9"></path>

                                            <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"></path>

                                        </svg>

                                    </button>


                                    <button
                                        class="btn-eliminar"
                                        title="Eliminar"
                                        aria-label="Eliminar lote"
                                        onclick="eliminarLote(${indice})">

                                        <svg
                                            viewBox="0 0 24 24"
                                            fill="none"
                                            stroke="currentColor"
                                            stroke-width="2">

                                            <polyline
                                                points="3 6 5 6 21 6">
                                            </polyline>

                                            <path
                                                d="M19 6l-1 14H6L5 6">
                                            </path>

                                            <path d="M10 11v6"></path>

                                            <path d="M14 11v6"></path>

                                            <path d="M9 6V4h6v2">
                                            </path>

                                        </svg>

                                    </button>

                                </td>

                            </tr>

                        `;

                    }
                ).join("");

        }


        /* =====================================================
           ESCAPAR HTML
           ===================================================== */

        function escapeHtml(valor) {

            if (
                valor === null ||
                valor === undefined
            ) {

                return "";

            }


            return String(valor)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");

        }


        /* =====================================================
           EDITAR LOTE
           ===================================================== */

        function editarLote(indice) {

            const lote =
                lotes[indice];


            if (!lote) {

                return;

            }


            loteEditando =
                lote;


            document.getElementById(
                "lote"
            ).value =
                lote.Lote || "";


            document.getElementById(
                "fecha-vencimiento"
            ).value =
                lote["Fecha vencimiento"] || "";


            document.getElementById(
                "btn-guardar"
            ).textContent =
                "Actualizar lote";


            document.getElementById(
                "btn-cancelar"
            ).style.display =
                "inline-block";


            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });

        }


        /* =====================================================
           CANCELAR EDICIÓN
           ===================================================== */

        function cancelarEdicion() {

            loteEditando = null;


            document.getElementById(
                "lote-form"
            ).reset();


            document.getElementById(
                "btn-guardar"
            ).textContent =
                "Guardar lote";


            document.getElementById(
                "btn-cancelar"
            ).style.display =
                "none";

        }


        /* =====================================================
           GUARDAR / ACTUALIZAR LOTE
           ===================================================== */

        document
            .getElementById("lote-form")
            .addEventListener(
                "submit",
                async function(event) {

                    event.preventDefault();


                    const Lote =
                        document
                            .getElementById(
                                "lote"
                            )
                            .value
                            .trim();


                    const FechaVencimiento =
                        document
                            .getElementById(
                                "fecha-vencimiento"
                            )
                            .value;


                    if (!Lote) {

                        mostrarMensaje(
                            "Debe ingresar el lote.",
                            "error"
                        );

                        return;

                    }


                    if (!FechaVencimiento) {

                        mostrarMensaje(
                            "Debe ingresar la fecha de vencimiento.",
                            "error"
                        );

                        return;

                    }


                    const btnGuardar =
                        document.getElementById(
                            "btn-guardar"
                        );


                    btnGuardar.disabled =
                        true;


                    try {


                        /* =====================================
                           ACTUALIZAR
                           ===================================== */

                        if (loteEditando) {

                            const {
                                error
                            } =
                                await supabaseClient
                                    .from("Lotes")
                                    .update({

                                        "Lote":
                                            Lote,

                                        "Fecha vencimiento":
                                            FechaVencimiento

                                    })
                                    .eq(
                                        "Lote",
                                        loteEditando.Lote
                                    );


                            if (error) {

                                console.error(
                                    "Error al actualizar lote:",
                                    error
                                );


                                mostrarMensaje(
                                    "No se pudo actualizar el lote: " +
                                    error.message,
                                    "error"
                                );


                                btnGuardar.disabled =
                                    false;

                                return;

                            }


                            mostrarMensaje(
                                "Lote actualizado correctamente.",
                                "exito"
                            );


                            cancelarEdicion();


                            await cargarLotes();


                            btnGuardar.disabled =
                                false;


                            return;

                        }


                        /* =====================================
                           INSERTAR
                           ===================================== */

                        const {
                            data,
                            error
                        } =
                            await supabaseClient
                                .from("Lotes")
                                .insert({

                                    "Lote":
                                        Lote,

                                    "Fecha vencimiento":
                                        FechaVencimiento

                                })
                                .select();


                        if (error) {

                            console.error(
                                "Error al guardar lote:",
                                error
                            );


                            mostrarMensaje(
                                "No se pudo guardar el lote: " +
                                error.message,
                                "error"
                            );


                            btnGuardar.disabled =
                                false;

                            return;

                        }


                        mostrarMensaje(
                            "Lote guardado correctamente.",
                            "exito"
                        );


                        document
                            .getElementById(
                                "lote-form"
                            )
                            .reset();


                        await cargarLotes();


                        btnGuardar.disabled =
                            false;


                    } catch (error) {

                        console.error(error);


                        mostrarMensaje(
                            "Ocurrió un error: " +
                            error.message,
                            "error"
                        );


                        btnGuardar.disabled =
                            false;

                    }

                }
            );


        /* =====================================================
           ELIMINAR LOTE
           ===================================================== */

        async function eliminarLote(indice) {

            const lote =
                lotes[indice];


            if (!lote) {

                return;

            }


            const confirmar =
                confirm(
                    "¿Está seguro de que desea eliminar el lote " +
                    lote.Lote +
                    "?"
                );


            if (!confirmar) {

                return;

            }


            try {

                const {
                    error
                } =
                    await supabaseClient
                        .from("Lotes")
                        .delete()
                        .eq(
                            "Lote",
                            lote.Lote
                        );


                if (error) {

                    console.error(
                        "Error al eliminar lote:",
                        error
                    );


                    mostrarMensaje(
                        "No se pudo eliminar el lote: " +
                        error.message,
                        "error"
                    );

                    return;

                }


                mostrarMensaje(
                    "Lote eliminado correctamente.",
                    "exito"
                );


                await cargarLotes();


            } catch (error) {

                console.error(error);


                mostrarMensaje(
                    "Ocurrió un error al eliminar el lote: " +
                    error.message,
                    "error"
                );

            }

        }


        /* =====================================================
           INICIAR
           ===================================================== */

        cargarLotes();

    </script>
