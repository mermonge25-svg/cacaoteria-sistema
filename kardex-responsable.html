
<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kardex - Cacaotería S.R.L.</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
* {
    box-sizing: border-box;
    font-family: "Barlow", Arial, sans-serif;
}

body {
    margin: 0;
    background-color: #f5f5f5;
    color: #333;
}

header {
    background-color: #5B2326;
    color: white;
    padding: 18px 30px;
    text-align: left;
    border-bottom: 4px solid #E14E39;
}

header h1 {
    margin: 0;
    font-size: 30px;
}

header p {
    margin: 4px 0 0;
    font-size: 16px;
}

.container {
    width: 95%;
    max-width: 1500px;
    margin: 25px auto;
}

.panel {
    background: white;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(91,35,38,0.10);
}

.top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    flex-wrap: wrap;
    margin-bottom: 20px;
}

.top-bar h2 {
    margin: 0;
    color: #5B2326;
    font-size: 24px;
    text-align: left;
}

button {
    background-color: #E14E39;
    color: white;
    border: none;
    padding: 10px 18px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 16px;
}

button:hover {
    background-color: #5B2326;
}

.estado {
    padding: 10px;
    margin-bottom: 15px;
    border-radius: 6px;
    background-color: #eee;
    display: none;
}

.filtros {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 20px;
}

.filtros label {
    font-weight: bold;
    color: #5B2326;
}

.filtros select {
    padding: 9px 10px;
    border: 1px solid #5B2326;
    border-radius: 6px;
    font-family: "Barlow", Arial, sans-serif;
    font-size: 15px;
    background-color: white;
    min-width: 150px;
    max-width: 260px;
}

.filtros select:focus {
    outline: none;
    border-color: #E14E39;
    box-shadow: 0 0 0 2px rgba(225,78,57,0.15);
}

.tabla-contenedor {
    width: 100%;
    overflow-x: auto;
    overflow-y: hidden;
}

table {
    width: 100%;
    min-width: 1350px;
    border-collapse: collapse;
    background-color: white;
}

th {
    background-color: #5B2326;
    color: white;
    padding: 12px;
    border: none;
    border-bottom: 3px solid #E14E39;
    text-align: center;
    white-space: nowrap;
    font-size: 16px;
    font-weight: bold;
}

td {
    padding: 12px;
    border: none;
    border-bottom: 1px solid #ddd;
    text-align: center;
    white-space: nowrap;
    font-size: 15px;
    background-color: white;
}

td:nth-child(1),
td:nth-child(2),
td:nth-child(5),
td:nth-child(7) {
    text-align: left;
}

tbody tr {
    background-color: white;
}

tbody tr:hover {
    background-color: rgba(225,78,57,0.08);
}

tbody tr:last-child td {
    border-bottom: none;
}

.numero {
    text-align: center;
}

.saldo-final {
    font-weight: bold;
    color: #E14E39;
}

.sin-datos {
    text-align: center;
    padding: 25px;
    color: #777;
}

.tabla-contenedor::-webkit-scrollbar {
    height: 10px;
}

.tabla-contenedor::-webkit-scrollbar-track {
    background: #eeeeee;
    border-radius: 10px;
}

.tabla-contenedor::-webkit-scrollbar-thumb {
    background: #5B2326;
    border-radius: 10px;
}

.tabla-contenedor::-webkit-scrollbar-thumb:hover {
    background: #5B2326;
}

@media (max-width: 700px) {
    header {
        padding: 16px 20px;
    }

    header h1 {
        font-size: 25px;
    }

    .container {
        width: 98%;
        margin: 12px auto;
    }

    .panel {
        padding: 12px;
    }

    .filtros {
        align-items: stretch;
        flex-direction: column;
    }

    .filtros select {
        max-width: none;
        width: 100%;
    }
}
</style>
</head>

<body>

<header>
    <h1>Cacaotería S.R.L.</h1>
    <p>Sistema de Gestión Operativa</p>
</header>

<div class="container">
    <div class="panel">

        <div class="top-bar">
            <h2>Kardex de Inventario</h2>
            <button onclick="cargarKardex()">Actualizar</button>
        </div>

        <div class="filtros">

            <label for="filtroResponsable">Responsable:</label>
            <select id="filtroResponsable" onchange="aplicarFiltros()">
                <option value="">Todos</option>
            </select>

            <label for="filtroUbicacion">Ubicación:</label>
            <select id="filtroUbicacion" onchange="aplicarFiltros()">
                <option value="">Todas</option>
            </select>

            <label for="filtroProducto">Tipo:</label>
            <select id="filtroProducto" onchange="cambiarTipoProducto()">
                <option value="">Todos</option>
            </select>

            <label for="filtroNombreProducto">Producto:</label>
            <select id="filtroNombreProducto" onchange="aplicarFiltros()">
                <option value="">Todos los productos</option>
            </select>

        </div>

        <div id="estado" class="estado"></div>

        <div class="tabla-contenedor">
            <table>
                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Lote</th>
                        <th>Ubicación</th>
                        <th>Responsable</th>
                        <th>Tipo</th>
                        <th>Unidad de Medida</th>
                        <th>Descripción</th>
                        <th>Saldo Inicial</th>
                        <th>Entradas</th>
                        <th>Salidas</th>
                        <th>Saldo Final</th>
                    </tr>
                </thead>
                <tbody id="tablaKardex"></tbody>
            </table>
        </div>

    </div>
</div>

<script>
/* ============================================================
   CONFIGURACIÓN SUPABASE
   ============================================================ */

const SUPABASE_URL =
    "https://shjfohkiyfnqedrzjqpy.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_PT4ozb9f0-0BoLE5yZDpBw_hhXPCzOs";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

let productosDisponibles = [];
let kardexDatos = [];


/* ============================================================
   NORMALIZAR TEXTO
   ============================================================ */

function normalizar(valor) {
    if (valor === null || valor === undefined) {
        return "";
    }

    return String(valor)
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/\s+/g, " ")
        .trim()
        .toLowerCase();
}


/* ============================================================
   OBTENER VALOR DE COLUMNA
   ============================================================ */

function obtenerValor(objeto, nombres) {
    if (!objeto) {
        return "";
    }

    const claves = Object.keys(objeto);

    for (const nombre of nombres) {
        const nombreNormalizado = normalizar(nombre);

        const encontrada = claves.find(
            clave => normalizar(clave) === nombreNormalizado
        );

        if (encontrada !== undefined) {
            const valor = objeto[encontrada];

            if (valor !== null && valor !== undefined) {
                return valor;
            }
        }
    }

    return "";
}


/* ============================================================
   ESCAPAR HTML
   ============================================================ */

function escapeHTML(valor) {
    if (valor === null || valor === undefined) {
        return "";
    }

    return String(valor)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* ============================================================
   NORMALIZAR LOTE
   ============================================================ */

function normalizarLote(valor) {
    if (valor === null || valor === undefined) {
        return "sin_lote";
    }

    const texto = String(valor).trim();

    if (
        texto === "" ||
        texto === "—" ||
        texto === "-" ||
        texto.toLowerCase() === "null" ||
        texto.toLowerCase() === "undefined"
    ) {
        return "sin_lote";
    }

    return normalizar(texto);
}


/* ============================================================
   COMPROBAR SI EL SALDO ES CERO
   ============================================================ */

function saldoEsCero(valor) {
    if (
        valor === null ||
        valor === undefined ||
        valor === ""
    ) {
        return true;
    }

    const numero = Number(
        String(valor).replace(/,/g, "").trim()
    );

    if (!Number.isFinite(numero)) {
        return true;
    }

    return Math.abs(numero) < 0.000001;
}


/* ============================================================
   FORMATEAR NÚMEROS
   ============================================================ */

function formatearNumero(numero) {
    if (
        numero === null ||
        numero === undefined ||
        numero === ""
    ) {
        return "0";
    }

    return Number(numero).toLocaleString("es-CR", {
        useGrouping: true,
        maximumFractionDigits: 20
    });
}


/* ============================================================
   CARGAR PRODUCTOS DESDE SUPABASE
   ============================================================ */

async function cargarProductosParaFiltro() {
    const estado = document.getElementById("estado");

    const resultado = await supabaseClient
        .from("Productos")
        .select("*");

    if (resultado.error) {
        console.error(
            "Error cargando productos:",
            resultado.error
        );

        estado.style.display = "block";
        estado.textContent =
            "No se pudieron cargar los productos para el filtro: " +
            resultado.error.message;

        return;
    }

    productosDisponibles = resultado.data || [];

    cargarTiposDesdeProductos();
    actualizarFiltroProductos();
}


/* ============================================================
   CARGAR TIPOS
   ============================================================ */

function cargarTiposDesdeProductos() {
    const filtroTipo = document.getElementById("filtroProducto");
    const tipoAnterior = filtroTipo.value;

    filtroTipo.innerHTML = `
        <option value="">Todos</option>
    `;

    const tipos = [];

    productosDisponibles.forEach(producto => {
        const tipo = obtenerValor(producto, ["Tipo"]);

        if (
            tipo &&
            !tipos.some(
                existente =>
                    normalizar(existente) === normalizar(tipo)
            )
        ) {
            tipos.push(String(tipo).trim());
        }
    });

    tipos.sort((a, b) =>
        a.localeCompare(b, "es", { sensitivity: "base" })
    );

    tipos.forEach(tipo => {
        const option = document.createElement("option");
        option.value = tipo;
        option.textContent = tipo;
        filtroTipo.appendChild(option);
    });

    if (
        Array.from(filtroTipo.options).some(
            option => normalizar(option.value) === normalizar(tipoAnterior)
        )
    ) {
        filtroTipo.value = tipoAnterior;
    }
}


/* ============================================================
   ACTUALIZAR PRODUCTOS SEGÚN EL TIPO
   El filtro muestra únicamente el nombre del producto.
   ============================================================ */

function actualizarFiltroProductos() {
    const filtroTipo = document.getElementById("filtroProducto");
    const filtroNombre = document.getElementById("filtroNombreProducto");

    const tipoSeleccionado = filtroTipo.value;
    const productoAnterior = filtroNombre.value;

    filtroNombre.innerHTML = `
        <option value="">Todos los productos</option>
    `;

    const productosFiltrados = productosDisponibles.filter(producto => {
        const tipo = obtenerValor(producto, ["Tipo"]);

        return (
            !tipoSeleccionado ||
            normalizar(tipo) === normalizar(tipoSeleccionado)
        );
    });

    productosFiltrados.sort((a, b) => {
        const nombreA = normalizar(
            obtenerValor(a, ["Descripcion", "Descripción", "Nombre"])
        );

        const nombreB = normalizar(
            obtenerValor(b, ["Descripcion", "Descripción", "Nombre"])
        );

        return nombreA.localeCompare(nombreB, "es");
    });

    productosFiltrados.forEach(producto => {
        const codigo = obtenerValor(producto, ["Codigo", "Código"]);

        const descripcion = obtenerValor(
            producto,
            ["Descripcion", "Descripción", "Nombre"]
        );

        /*
         * El valor de la opción conserva el código para identificar
         * el producto correctamente, pero el texto visible muestra
         * únicamente la descripción.
         */
        const identificador = String(codigo || descripcion || "").trim();

        if (!identificador) {
            return;
        }

        const option = document.createElement("option");

        option.value = identificador;
        option.textContent = descripcion || identificador;

        filtroNombre.appendChild(option);
    });

    const productoSigueDisponible = Array.from(
        filtroNombre.options
    ).some(option => option.value === productoAnterior);

    filtroNombre.value = productoSigueDisponible
        ? productoAnterior
        : "";
}


/* ============================================================
   CAMBIAR TIPO DE PRODUCTO
   ============================================================ */

function cambiarTipoProducto() {
    actualizarFiltroProductos();
    aplicarFiltros();
}


/* ============================================================
   CARGAR KARDEX
   ============================================================ */

async function cargarKardex() {
    const tabla = document.getElementById("tablaKardex");
    const estado = document.getElementById("estado");

    tabla.innerHTML = "";

    estado.style.display = "block";
    estado.textContent =
        "Cargando información actualizada desde Supabase...";

    try {
        const resultado = await supabaseClient
            .from("Kardex_Responsable")
            .select("*");

        if (resultado.error) {
            throw resultado.error;
        }

        kardexDatos = (resultado.data || []).filter(fila => {
            const saldoFinal = obtenerValor(fila, ["Saldo Final"]);
            return !saldoEsCero(saldoFinal);
        });

        kardexDatos.sort((a, b) => {
            const campos = [
                ["Responsable"],
                ["Ubicacion", "Ubicación"],
                ["Tipo"],
                ["Descripcion", "Descripción"],
                ["Codigo", "Código"],
                ["Lote"]
            ];

            for (const campo of campos) {
                const valorA = campo[0] === "Lote"
                    ? normalizarLote(obtenerValor(a, campo))
                    : normalizar(obtenerValor(a, campo));

                const valorB = campo[0] === "Lote"
                    ? normalizarLote(obtenerValor(b, campo))
                    : normalizar(obtenerValor(b, campo));

                const comparacion = valorA.localeCompare(
                    valorB,
                    "es",
                    { sensitivity: "base" }
                );

                if (comparacion !== 0) {
                    return comparacion;
                }
            }

            return 0;
        });

        if (kardexDatos.length === 0) {
            tabla.innerHTML = `
                <tr>
                    <td colspan="11" class="sin-datos">
                        No hay registros para mostrar en el Kardex.
                    </td>
                </tr>
            `;

            estado.style.display = "none";
            actualizarFiltrosKardex();
            return;
        }

        kardexDatos.forEach(fila => {
            const codigo = obtenerValor(fila, ["Codigo", "Código"]);
            const lote = obtenerValor(fila, ["Lote"]);
            const ubicacion = obtenerValor(fila, ["Ubicacion", "Ubicación"]);
            const responsable = obtenerValor(fila, ["Responsable"]);
            const tipo = obtenerValor(fila, ["Tipo"]);

            const unidadMedida = obtenerValor(
                fila,
                ["Unidad_Medida", "Unidad de Medida"]
            );

            const descripcion = obtenerValor(
                fila,
                ["Descripcion", "Descripción"]
            );

            const saldoInicial = Number(
                obtenerValor(fila, ["Saldo Inicial"])
            ) || 0;

            const entradas = Number(
                obtenerValor(fila, ["Entradas"])
            ) || 0;

            const salidas = Number(
                obtenerValor(fila, ["Salidas"])
            ) || 0;

            const saldoFinal = Number(
                obtenerValor(fila, ["Saldo Final"])
            ) || 0;

            if (saldoEsCero(saldoFinal)) {
                return;
            }

            const tr = document.createElement("tr");

            tr.innerHTML = `
                <td>${escapeHTML(codigo)}</td>
                <td>${escapeHTML(lote)}</td>
                <td>${escapeHTML(ubicacion)}</td>
                <td>${escapeHTML(responsable)}</td>
                <td>${escapeHTML(tipo)}</td>
                <td>${escapeHTML(unidadMedida)}</td>
                <td>${escapeHTML(descripcion)}</td>
                <td class="numero">${formatearNumero(saldoInicial)}</td>
                <td class="numero">${formatearNumero(entradas)}</td>
                <td class="numero">${formatearNumero(salidas)}</td>
                <td class="numero saldo-final">${formatearNumero(saldoFinal)}</td>
            `;

            tabla.appendChild(tr);
        });

        estado.style.display = "none";

        actualizarFiltrosKardex();
        aplicarFiltros();

        console.log("Kardex cargado desde Supabase.");
        console.log("Filas mostradas:", kardexDatos.length);

    } catch (error) {
        console.error("ERROR CARGANDO KARDEX:", error);

        estado.style.display = "block";
        estado.textContent =
            "Error al cargar el Kardex: " +
            (error.message || error);

        tabla.innerHTML = `
            <tr>
                <td colspan="11" class="sin-datos">
                    No se pudo cargar el Kardex.
                </td>
            </tr>
        `;
    }
}


/* ============================================================
   ACTUALIZAR FILTROS DE RESPONSABLE Y UBICACIÓN
   ============================================================ */

function actualizarFiltrosKardex() {
    const filtroResponsable = document.getElementById("filtroResponsable");
    const filtroUbicacion = document.getElementById("filtroUbicacion");

    const responsableAnterior = filtroResponsable.value;
    const ubicacionAnterior = filtroUbicacion.value;

    filtroResponsable.innerHTML = `<option value="">Todos</option>`;
    filtroUbicacion.innerHTML = `<option value="">Todas</option>`;

    const responsables = [];
    const ubicaciones = [];

    kardexDatos.forEach(fila => {
        const responsable = obtenerValor(fila, ["Responsable"]);
        const ubicacion = obtenerValor(fila, ["Ubicacion", "Ubicación"]);

        if (
            responsable &&
            !responsables.some(
                item => normalizar(item) === normalizar(responsable)
            )
        ) {
            responsables.push(String(responsable).trim());
        }

        if (
            ubicacion &&
            !ubicaciones.some(
                item => normalizar(item) === normalizar(ubicacion)
            )
        ) {
            ubicaciones.push(String(ubicacion).trim());
        }
    });

    responsables.sort((a, b) =>
        a.localeCompare(b, "es", { sensitivity: "base" })
    );

    ubicaciones.sort((a, b) =>
        a.localeCompare(b, "es", { sensitivity: "base" })
    );

    responsables.forEach(responsable => {
        const option = document.createElement("option");
        option.value = responsable;
        option.textContent = responsable;
        filtroResponsable.appendChild(option);
    });

    ubicaciones.forEach(ubicacion => {
        const option = document.createElement("option");
        option.value = ubicacion;
        option.textContent = ubicacion;
        filtroUbicacion.appendChild(option);
    });

    if (
        Array.from(filtroResponsable.options).some(
            option => option.value === responsableAnterior
        )
    ) {
        filtroResponsable.value = responsableAnterior;
    }

    if (
        Array.from(filtroUbicacion.options).some(
            option => option.value === ubicacionAnterior
        )
    ) {
        filtroUbicacion.value = ubicacionAnterior;
    }
}


/* ============================================================
   APLICAR TODOS LOS FILTROS
   ============================================================ */

function aplicarFiltros() {
    const filtroResponsable = document.getElementById(
        "filtroResponsable"
    ).value;

    const filtroUbicacion = document.getElementById(
        "filtroUbicacion"
    ).value;

    const filtroTipo = document.getElementById(
        "filtroProducto"
    ).value;

    const filtroNombre = document.getElementById(
        "filtroNombreProducto"
    ).value;

    const filas = document.querySelectorAll("#tablaKardex tr");

    filas.forEach(fila => {
        if (fila.querySelector(".sin-datos")) {
            return;
        }

        const codigo = fila.cells[0]?.textContent.trim() || "";
        const responsable = fila.cells[3]?.textContent.trim() || "";
        const ubicacion = fila.cells[2]?.textContent.trim() || "";
        const tipo = fila.cells[4]?.textContent.trim() || "";
        const descripcion = fila.cells[6]?.textContent.trim() || "";

        const coincideResponsable =
            !filtroResponsable ||
            normalizar(responsable) === normalizar(filtroResponsable);

        const coincideUbicacion =
            !filtroUbicacion ||
            normalizar(ubicacion) === normalizar(filtroUbicacion);

        const coincideTipo =
            !filtroTipo ||
            normalizar(tipo) === normalizar(filtroTipo);

        /*
         * El filtro conserva el código como valor interno,
         * aunque el usuario solo vea el nombre del producto.
         */
        const productoSeleccionado = productosDisponibles.find(producto => {
            const codigoProducto = obtenerValor(producto, ["Codigo", "Código"]);
            const descripcionProducto = obtenerValor(
                producto,
                ["Descripcion", "Descripción", "Nombre"]
            );

            return String(codigoProducto || descripcionProducto || "").trim()
                === filtroNombre;
        });

        const codigoSeleccionado = productoSeleccionado
            ? String(obtenerValor(
                productoSeleccionado,
                ["Codigo", "Código"]
            ) || "").trim()
            : "";

        const descripcionSeleccionada = productoSeleccionado
            ? String(obtenerValor(
                productoSeleccionado,
                ["Descripcion", "Descripción", "Nombre"]
            ) || "").trim()
            : "";

        const coincideProducto =
            !filtroNombre ||
            (
                codigoSeleccionado &&
                normalizar(codigo) === normalizar(codigoSeleccionado)
            ) ||
            (
                descripcionSeleccionada &&
                normalizar(descripcion) === normalizar(descripcionSeleccionada)
            ) ||
            (
                !productoSeleccionado &&
                (
                    normalizar(codigo) === normalizar(filtroNombre) ||
                    normalizar(descripcion) === normalizar(filtroNombre)
                )
            );

        fila.style.display =
            coincideResponsable &&
            coincideUbicacion &&
            coincideTipo &&
            coincideProducto
                ? ""
                : "none";
    });
}


/* ============================================================
   ACTUALIZACIÓN AUTOMÁTICA DESDE SUPABASE
   ============================================================ */

function activarActualizacionAutomatica() {
    supabaseClient
        .channel("kardex-tiempo-real")

        .on(
            "postgres_changes",
            {
                event: "*",
                schema: "public",
                table: "Inventario"
            },
            payload => {
                console.log("Cambio en Inventario:", payload);
                cargarKardex();
            }
        )

        .on(
            "postgres_changes",
            {
                event: "*",
                schema: "public",
                table: "Movimientos"
            },
            payload => {
                console.log("Cambio en Movimientos:", payload);
                cargarKardex();
            }
        )

        .on(
            "postgres_changes",
            {

                table: "Kardex_Responsable"
            },
            payload => {

        )

        .on(
