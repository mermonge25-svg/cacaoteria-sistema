
<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kardex - Cacaotería S.R.L.</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
    --cafe:#5B2326;
    --cafe-hover:#45191C;
    --fondo:#f5f5f5;
    --blanco:#fff;
    --gris:#ddd;
    --gris-texto:#777;
}

*{
    box-sizing:border-box;
    font-family:"Barlow",Arial,sans-serif;
}

body{
    margin:0;
    background:var(--fondo);
    color:#333;
}

header{
    background:var(--cafe);
    color:var(--blanco);
    padding:20px 30px;
    border-bottom:4px solid var(--cafe);
}

header h1{
    margin:0;
    font-size:28px;
}

header p{
    margin:5px 0 0;
    font-size:14px;
}

.contenedor{
    max-width:1600px;
    margin:30px auto;
    padding:0 20px;
}

.encabezado{
    display:flex;
    flex-direction:column;
    align-items:stretch;
    gap:16px;
    margin-bottom:20px;
    width:100%;
}

.encabezado h2{
    margin:0;
    color:var(--cafe);
    white-space:nowrap;
    font-size:21px;
    font-weight:700;
}

.acciones-superior{
    display:grid;
    grid-template-columns:minmax(280px,1fr) auto;
    align-items:center;
    gap:25px;
    width:100%;
}

.filtros{
    display:flex;
    flex-direction:column;
    gap:10px;
    max-width:430px;
    width:100%;
}

.filtro-grupo{
    display:grid;
    grid-template-columns:110px minmax(0,1fr);
    align-items:center;
    gap:10px;
    width:100%;
}

.filtro-grupo label{
    font-weight:700;
    color:var(--cafe);
    white-space:nowrap;
}

.filtro-grupo select{
    width:100%;
    padding:9px 12px;
    border:1px solid var(--cafe);
    border-radius:6px;
    background:var(--blanco);
    font-size:14px;
    min-width:0;
    color:#333;
}

.filtro-grupo select:focus{
    outline:none;
    border-color:var(--cafe-hover);
    box-shadow:0 0 0 2px rgba(91,35,38,.10);
}

.acciones-derecha{
    display:flex;
    flex-direction:column;
    align-items:stretch;
    justify-content:center;
    gap:12px;
    min-width:210px;
}

.total{
    background:var(--blanco);
    padding:12px 18px;
    border-radius:8px;
    box-shadow:0 2px 6px rgba(0,0,0,.08);
    font-weight:700;
    text-align:center;
    white-space:nowrap;
}

.btn-actualizar{
    background:var(--cafe);
    color:var(--blanco);
    border:0;
    padding:12px 18px;
    border-radius:6px;
    cursor:pointer;
    font-size:14px;
    font-weight:700;
    white-space:nowrap;
    width:100%;
}

.btn-actualizar:hover{
    background:var(--cafe-hover);
}

.btn-actualizar:disabled{
    opacity:.6;
    cursor:wait;
}

.tabla-contenedor{
    background:var(--blanco);
    border-radius:10px;
    overflow-x:auto;
    width:100%;
    box-shadow:0 2px 6px rgba(0,0,0,.08);
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:1350px;
}

th{
    background:var(--cafe);
    color:var(--blanco);
    padding:14px 12px;
    text-align:left;
    white-space:nowrap;
    border-bottom:3px solid var(--cafe);
    font-size:15px;
}

td{
    padding:12px;
    border-bottom:1px solid var(--gris);
    white-space:nowrap;
    font-size:14px;
}

tbody tr:hover{
    background:#f5f2f2;
}

td.numero{
    text-align:center;
}

td.saldo-final{
    font-weight:700;
    color:var(--cafe);
}

.sin-dato{
    color:#888;
}

.mensaje-vacio,
.mensaje-cargando{
    text-align:center;
    padding:30px;
    color:var(--gris-texto);
}

.mensaje-cargando{
    color:var(--cafe);
}

.estado-error{
    display:none;
    background:#f8eeee;
    color:var(--cafe);
    padding:12px 15px;
    border-radius:6px;
    margin-bottom:15px;
    border-left:4px solid var(--cafe);
    overflow-wrap:anywhere;
}

@media(max-width:1000px){
    .acciones-superior{
        grid-template-columns:1fr;
        gap:15px;
    }

    .filtros{
        max-width:none;
    }

    .acciones-derecha{
        flex-direction:row;
        align-items:center;
        width:100%;
    }

    .total,
    .btn-actualizar{
        flex:1;
    }
}

@media(max-width:700px){
    header{
        padding:18px 20px;
    }

    .encabezado h2{
        font-size:19px;
        white-space:normal;
    }

    .contenedor{
        padding:0 10px;
        margin:15px auto;
    }

    .filtro-grupo{
        grid-template-columns:1fr;
        gap:5px;
    }

    .acciones-derecha{
        flex-direction:column;
    }

    .total,
    .btn-actualizar{
        width:100%;
    }
}
</style>
</head>

<body>

<header>
    <h1>Cacaotería S.R.L.</h1>
    <p>Sistema de Gestión Operativa</p>
</header>

<main class="contenedor">

    <div class="encabezado">

        <h2>Kardex de Inventario</h2>

        <div class="acciones-superior">

            <div class="filtros">

                <div class="filtro-grupo">
                    <label for="filtroTipo">Mostrar:</label>
                    <select id="filtroTipo" onchange="filtrarPorTipo()">
                        <option value="todos">Todos</option>
                        <option value="producto terminado">Producto terminado</option>
                        <option value="materias primas">Materias primas</option>
                        <option value="material de empaque">Material de empaque</option>
                    </select>
                </div>

                <div class="filtro-grupo">
                    <label for="filtroProducto">Producto:</label>
                    <select id="filtroProducto" onchange="filtrarPorProducto()">
                        <option value="">Todos los productos</option>
                    </select>
                </div>

                <div class="filtro-grupo">
                    <label for="filtroResponsable">Responsable:</label>
                    <select id="filtroResponsable" onchange="filtrarPorResponsable()">
                        <option value="">Todos los responsables</option>
                    </select>
                </div>

            </div>

            <div class="acciones-derecha">

                <div class="total">
                    Registros: <span id="totalRegistros">0</span>
                </div>

                <button
                    type="button"
                    class="btn-actualizar"
                    id="btnActualizar"
                    onclick="cargarKardex()"
                >
                    Actualizar
                </button>

            </div>

        </div>
    </div>

    <div id="estadoError" class="estado-error"></div>

    <div class="tabla-contenedor">

        <table>
            <thead>
                <tr>
                    <th>Código</th>
                    <th>Lote</th>
                    <th>Ubicación</th>
                    <th>Responsable</th>
                    <th>Tipo</th>
                    <th>Unidad de medida</th>
                    <th>Descripción</th>
                    <th>Saldo inicial</th>
                    <th>Entradas</th>
                    <th>Salidas</th>
                    <th>Saldo final</th>
                </tr>
            </thead>

            <tbody id="tablaKardex"></tbody>
        </table>

        <div id="mensajeCargando" class="mensaje-cargando">
            Cargando información del Kardex...
        </div>

        <div id="mensajeVacio" class="mensaje-vacio" style="display:none">
            No hay registros para mostrar.
        </div>

    </div>

</main>

<script>

/* CONFIGURACIÓN SUPABASE */

const SUPABASE_URL =
"https://shjfohkiyfnqedrzjqpy.supabase.co";

const SUPABASE_KEY =
"sb_publishable_PT4ozb9f0-0BoLE5yZDpBw_hhXPCzOs";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

let kardexDatos = [];

let responsableSeleccionado = "";
let productoSeleccionado = "";

let vistaActual = "todos";

let canalKardex = null;
let cargando = false;


/* NORMALIZACIÓN */

function normalizarTexto(valor){
    return String(valor ?? "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g,"")
        .replace(/\s+/g," ")
        .trim()
        .toLowerCase();
}


/* OBTENER VALOR DE COLUMNA */

function obtenerValor(objeto,nombres){

    if(!objeto) return "";

    const claves = Object.keys(objeto);

    for(const nombre of nombres){

        const buscada = normalizarTexto(nombre);

        const encontrada = claves.find(
            clave => normalizarTexto(clave) === buscada
        );

        if(encontrada !== undefined){

            const valor = objeto[encontrada];

            if(valor !== null && valor !== undefined){
                return valor;
            }
        }
    }

    return "";
}


/* CLASIFICACIÓN DE TIPOS */

function esTipoMateriaPrima(tipo){

    return [
        "materia prima",
        "materias primas"
    ].includes(normalizarTexto(tipo));
}


function esTipoMaterialEmpaque(tipo){

    return [
        "material empaque",
        "material de empaque",
        "materiales de empaque"
    ].includes(normalizarTexto(tipo));
}


function esTipoProductoTerminado(tipo){

    return [
        "producto terminado",
        "productos terminados"
    ].includes(normalizarTexto(tipo));
}


function esTipoInsumo(tipo){

    return (
        esTipoMateriaPrima(tipo) ||
        esTipoMaterialEmpaque(tipo) ||
        [
            "suministro",
            "suministros",
            "otro",
            "otros"
        ].includes(normalizarTexto(tipo))
    );
}


/* DETERMINAR SI EL REGISTRO PERTENECE AL FILTRO */

function perteneceVista(tipo){

    if(vistaActual === "todos"){
        return true;
    }

    if(vistaActual === "producto terminado"){
        return esTipoProductoTerminado(tipo);
    }

    if(vistaActual === "materias primas"){
        return esTipoMateriaPrima(tipo);
    }

    if(vistaActual === "material de empaque"){
        return esTipoMaterialEmpaque(tipo);
    }

    return false;
}


/* CLAVE PARA IDENTIFICAR PRODUCTOS */

function claveProductoFiltro(tipo,descripcion){

    return (
        normalizarTexto(tipo) +
        "|||" +
        normalizarTexto(descripcion)
    );
}


/* NORMALIZAR LOTE */

function normalizarLote(valor){

    if(valor === null || valor === undefined){
        return "sin_lote";
    }

    const texto = String(valor).trim();

    if(
        texto === "" ||
        texto === "—" ||
        texto === "-" ||
        texto.toLowerCase() === "null" ||
        texto.toLowerCase() === "undefined"
    ){
        return "sin_lote";
    }

    return normalizarTexto(texto);
}


/* COMPROBAR SALDO CERO */

function saldoEsCero(valor){

    if(
        valor === null ||
        valor === undefined ||
        valor === ""
    ){
        return true;
    }

    const numero = Number(
        String(valor).replace(/,/g,"").trim()
    );

    if(!Number.isFinite(numero)){
        return true;
    }

    return Math.abs(numero) < 0.000001;
}


/* FORMATEAR NÚMEROS */

function formatearNumero(numero){

    if(
        numero === null ||
        numero === undefined ||
        numero === ""
    ){
        return "0";
    }

    return Number(numero).toLocaleString("es-CR",{
        useGrouping:true,
        maximumFractionDigits:20
    });
}


/* MOSTRAR MENSAJES */

function mostrarError(mensaje){

    const estado = document.getElementById("estadoError");

    estado.textContent = mensaje;
    estado.style.display = "block";
}


function ocultarError(){

    document.getElementById("estadoError").style.display = "none";
}


/* CONSTRUIR FILTRO DE PRODUCTOS */

function actualizarFiltroProducto(){

    const filtro = document.getElementById("filtroProducto");

    const valorAnterior = productoSeleccionado;

    filtro.innerHTML = `
        <option value="">Todos los productos</option>
    `;

    const productosUnicos = [];

    kardexDatos.forEach(fila => {

        const tipo = obtenerValor(fila,["Tipo"]);

        const descripcion = String(
            obtenerValor(fila,[
                "Descripcion",
                "Descripción"
            ]) || ""
        ).trim();

        if(!perteneceVista(tipo)) return;
        if(!descripcion) return;

        const clave = claveProductoFiltro(tipo,descripcion);

        const existe = productosUnicos.some(
            p => p.clave === clave
        );

        if(!existe){
            productosUnicos.push({
                clave,
                descripcion
            });
        }
    });

    productosUnicos.sort((a,b) =>
        a.descripcion.localeCompare(
            b.descripcion,
            "es",
            {sensitivity:"base"}
        )
    );

    productosUnicos.forEach(item => {

        const opcion = document.createElement("option");

        opcion.value = item.clave;
        opcion.textContent = item.descripcion;

        filtro.appendChild(opcion);
    });

    const sigueDisponible = productosUnicos.some(
        p => p.clave === valorAnterior
    );

    if(sigueDisponible){
        productoSeleccionado = valorAnterior;
        filtro.value = valorAnterior;
    }else{
        productoSeleccionado = "";
        filtro.value = "";
    }
}


/* CONSTRUIR FILTRO DE RESPONSABLES */

function actualizarFiltroResponsable(){

    const filtro = document.getElementById("filtroResponsable");

    const valorAnterior = responsableSeleccionado;

    filtro.innerHTML = `
        <option value="">Todos los responsables</option>
    `;

    const responsables = [];

    kardexDatos.forEach(fila => {

        if(!perteneceVista(obtenerValor(fila,["Tipo"]))){
            return;
        }

        const responsable = String(
            obtenerValor(fila,["Responsable"]) || ""
        ).trim();

        if(!responsable) return;

        const existe = responsables.some(
            r => normalizarTexto(r) === normalizarTexto(responsable)
        );

        if(!existe){
            responsables.push(responsable);
        }
    });

    responsables.sort((a,b) =>
        a.localeCompare(b,"es",{sensitivity:"base"})
    );

    responsables.forEach(responsable => {

        const opcion = document.createElement("option");

        opcion.value = responsable;
        opcion.textContent = responsable;

        filtro.appendChild(opcion);
    });

    const sigueDisponible = responsables.some(
        r => normalizarTexto(r) === normalizarTexto(valorAnterior)
    );

    if(sigueDisponible){
        responsableSeleccionado = valorAnterior;
        filtro.value = valorAnterior;
    }else{
        responsableSeleccionado = "";
        filtro.value = "";
    }
}


/* EVENTOS DE FILTROS */

function filtrarPorTipo(){

    vistaActual = document.getElementById("filtroTipo").value;

    responsableSeleccionado = "";
    productoSeleccionado = "";

    document.getElementById("filtroResponsable").value = "";
    document.getElementById("filtroProducto").value = "";

    actualizarFiltroProducto();
    actualizarFiltroResponsable();

    mostrarKardex();
}


function filtrarPorProducto(){

    productoSeleccionado =
        document.getElementById("filtroProducto").value;

    mostrarKardex();
}


function filtrarPorResponsable(){

    responsableSeleccionado =
        document.getElementById("filtroResponsable").value;

    mostrarKardex();
}


/* ORDENAR REGISTROS */

function ordenarKardex(){

    kardexDatos.sort((a,b) => {

        const campos = [
            ["Responsable"],
            ["Ubicacion","Ubicación"],
            ["Tipo"],
            ["Descripcion","Descripción"],
            ["Codigo","Código"],
            ["Lote"]
        ];

        for(const campo of campos){

            const esLote = campo[0] === "Lote";

            const valorA = esLote
                ? normalizarLote(obtenerValor(a,campo))
                : normalizarTexto(obtenerValor(a,campo));

            const valorB = esLote
                ? normalizarLote(obtenerValor(b,campo))
                : normalizarTexto(obtenerValor(b,campo));

            const comparacion = valorA.localeCompare(
                valorB,
                "es",
                {sensitivity:"base"}
            );

            if(comparacion !== 0){
                return comparacion;
            }
        }

        return 0;
    });
}


/* CARGAR KARDEX DESDE SUPABASE */

async function cargarKardex(){

    if(cargando) return;

    cargando = true;

    const tabla = document.getElementById("tablaKardex");
    const mensaje = document.getElementById("mensajeCargando");
    const boton = document.getElementById("btnActualizar");

    tabla.innerHTML = "";

    mensaje.style.display = "block";
    mensaje.textContent = "Cargando información del Kardex...";

    document.getElementById("mensajeVacio").style.display = "none";

    boton.disabled = true;
    boton.textContent = "Actualizando...";

    ocultarError();

    try{

        const {data,error} = await supabaseClient
            .from("Kardex_Responsable")
            .select("*");

        if(error) throw error;

        kardexDatos = (data || []).filter(fila => {

            const saldoFinal = obtenerValor(
                fila,
                ["Saldo Final"]
            );

            return !saldoEsCero(saldoFinal);
        });

        ordenarKardex();

        actualizarFiltroProducto();
        actualizarFiltroResponsable();

        mostrarKardex();

        mensaje.style.display = "none";

        console.log(
            "Kardex actualizado. Registros:",
            kardexDatos.length
        );

    }catch(error){

        console.error("Error cargando Kardex:",error);

        tabla.innerHTML = "";

        mensaje.style.display = "none";

        mostrarError(
            "No se pudo cargar el Kardex: " +
            (error.message || error)
        );

        document.getElementById("totalRegistros").textContent = "0";

        document.getElementById("mensajeVacio").textContent =
            "No se pudo obtener la información del Kardex.";

        document.getElementById("mensajeVacio").style.display = "block";

    }finally{

        cargando = false;

        boton.disabled = false;
        boton.textContent = "Actualizar";
    }
}


/* CREAR CELDA DE TABLA */

function agregarCelda(fila,valor,clases=""){

    const td = document.createElement("td");

    if(clases){
        td.className = clases;
    }

    if(
        valor !== null &&
        valor !== undefined &&
        valor !== ""
    ){
        td.textContent = valor;
    }else{

        const span = document.createElement("span");

        span.className = "sin-dato";
        span.textContent = "—";

        td.appendChild(span);
    }

    fila.appendChild(td);
}


/* MOSTRAR KARDEX APLICANDO FILTROS */

function mostrarKardex(){

    const tabla = document.getElementById("tablaKardex");
    const mensaje = document.getElementById("mensajeVacio");

    tabla.innerHTML = "";

    let lista = kardexDatos.filter(fila => {

        return perteneceVista(
            obtenerValor(fila,["Tipo"])
        );
    });

    /* FILTRO POR PRODUCTO */

    if(productoSeleccionado){

        const partes = productoSeleccionado.split("|||");

        const tipoFiltro = partes[0] || "";
        const descripcionFiltro = partes[1] || "";

        lista = lista.filter(fila => {

            const tipo = normalizarTexto(
                obtenerValor(fila,["Tipo"])
            );

            const descripcion = normalizarTexto(
                obtenerValor(fila,[
                    "Descripcion",
                    "Descripción"
                ])
            );

            return (
                tipo === tipoFiltro &&
                descripcion === descripcionFiltro
            );
        });
    }

    /* FILTRO POR RESPONSABLE */

    if(responsableSeleccionado){

        lista = lista.filter(fila => {

            const responsable = normalizarTexto(
                obtenerValor(fila,["Responsable"])
            );

            return responsable === normalizarTexto(
                responsableSeleccionado
            );
        });
    }

    /* CONTADOR */

    document.getElementById("totalRegistros").textContent =
        lista.length.toLocaleString("es-CR");

    /* MENSAJE VACÍO */

    if(lista.length === 0){

        if(productoSeleccionado){

            mensaje.textContent =
                "No hay registros para el producto seleccionado.";

        }else if(responsableSeleccionado){

            mensaje.textContent =
                "No hay registros para este responsable en esta categoría.";

        }else{

            const mensajes = {
                "todos":"No hay registros de inventario para mostrar.",
                "producto terminado":"No hay registros de producto terminado para mostrar.",
                "materias primas":"No hay registros de materias primas para mostrar.",
                "material de empaque":"No hay registros de material de empaque para mostrar."
            };

            mensaje.textContent =
                mensajes[vistaActual] || "No hay registros para mostrar.";
        }

        mensaje.style.display = "block";
        return;
    }

    mensaje.style.display = "none";

    /* CONSTRUIR FILAS */

    lista.forEach(fila => {

        const tr = document.createElement("tr");

        const codigo = obtenerValor(
            fila,
            ["Codigo","Código"]
        );

        const lote = obtenerValor(
            fila,
            ["Lote"]
        );

        const ubicacion = obtenerValor(
            fila,
            ["Ubicacion","Ubicación"]
        );

        const responsable = obtenerValor(
            fila,
            ["Responsable"]
        );

        const tipo = obtenerValor(
            fila,
            ["Tipo"]
        );

        const unidadMedida = obtenerValor(
            fila,
            ["Unidad_Medida","Unidad de Medida"]
        );

        const descripcion = obtenerValor(
            fila,
            ["Descripcion","Descripción"]
        );

        const saldoInicial = Number(
            obtenerValor(fila,["Saldo Inicial"])
        ) || 0;

        const entradas = Number(
            obtenerValor(fila,["Entradas"])
        ) || 0;

        const salidas = Number(
            obtenerValor(fila,["Salidas"])
        ) || 0;

        const saldoFinal = Number(
            obtenerValor(fila,["Saldo Final"])
        ) || 0;

        agregarCelda(tr,codigo);
        agregarCelda(tr,lote);
        agregarCelda(tr,ubicacion);
        agregarCelda(tr,responsable);
        agregarCelda(tr,tipo);
        agregarCelda(tr,unidadMedida);
        agregarCelda(tr,descripcion);

        agregarCelda(
            tr,
            formatearNumero(saldoInicial),
            "numero"
        );

        agregarCelda(
            tr,
            formatearNumero(entradas),
            "numero"
        );

        agregarCelda(
            tr,
            formatearNumero(salidas),
            "numero"
        );

        agregarCelda(
            tr,
            formatearNumero(saldoFinal),
            "numero saldo-final"
        );

        tabla.appendChild(tr);
    });
}


/* ACTUALIZACIÓN AUTOMÁTICA */

function activarActualizacionAutomatica(){

    if(canalKardex){
        supabaseClient.removeChannel(canalKardex);
    }

    canalKardex = supabaseClient
        .channel("kardex-tiempo-real")

        .on(
            "postgres_changes",
            {
                event:"*",
                schema:"public",
                table:"Inventario"
            },
            payload => {
                console.log("Cambio en Inventario:",payload);
                cargarKardex();
            }
        )

        .on(
            "postgres_changes",
            {
                event:"*",
                schema:"public",
                table:"Movimientos"
            },
            payload => {
                console.log("Cambio en Movimientos:",payload);
                cargarKardex();
            }
        )

        .on(
            "postgres_changes",
            {
                event:"*",
                schema:"public",
                table:"Kardex_Responsable"
            },
            payload => {
                console.log("Cambio en Kardex_Responsable:",payload);
                cargarKardex();
            }
        )

        .subscribe(status => {
            console.log(
                "Estado de actualización automática:",
                status
            );
        });
}


/* INICIAR APLICACIÓN */

document.addEventListener("DOMContentLoaded",async()=>{

    document.getElementById("filtroTipo").value = "todos";

    vistaActual = "todos";

    await cargarKardex();

    activarActualizacionAutomatica();
});

</script>
